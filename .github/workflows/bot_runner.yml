name: Kleinanzeigen Bot Runner

on:
  schedule:
    # Her 10 dakikada bir otomatik çalışır
    - cron: '*/10 * * * *'
  workflow_dispatch: # İstediğin zaman elle başlatabilmen için

jobs:
  run-bot:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py
